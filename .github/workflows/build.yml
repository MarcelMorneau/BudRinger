name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log || {
            grep -E "error:|FAILURE|What went wrong|Exception|timeout|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BudRinger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BudRinger-apk
          path: BudRinger.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BudRinger.apk
